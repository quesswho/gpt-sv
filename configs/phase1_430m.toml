# Phase 1 - 4x RTX 3060 12GB, DDP.
#
#   torchrun --nproc_per_node=4 -m gptsv.train --config configs/phase1_430m.toml
#
# The point of this tier is INFRASTRUCTURE CONFIDENCE, not throughput.
# GeForce cards have no NVLink and P2P is disabled in the driver, so all-reduce
# goes over PCIe host memory. Keep it data-parallel: tensor parallelism at this
# interconnect is slower than a single GPU. Verify here that checkpoint save /
# resume, determinism, and distributed Muon all behave, then move on.

[model]
vocab_size = 65536
dim = 1280
n_layers = 20
n_heads = 20
n_kv_heads = 4
max_seq_len = 2048
qk_norm = true
tie_embeddings = true
n_mtp_heads = 1
mtp_loss_weight = 0.3
z_loss_weight = 1e-4
loss_chunk_size = 2048
# Only the 12GB cards this config was first written for need recompute. Target
# hosts are >=24GB, where micro_batch 4 fits without it and the run is ~25%
# cheaper for the same tokens.
grad_checkpoint = false

[data]
# scripts/prepare_phase1_data.sh - sv64k-v2 tokenizer (sv64k + chat/reserved specials)
train_dir = "data/shards/sv64k-v2/train"
val_dir = "data/shards/sv64k-v2/val"
dtype = "uint16"

[optim]
use_muon = true
muon_lr = 0.02
adam_lr = 1e-3
grad_clip = 1.0

[schedule]
warmup_steps = 500
decay_frac = 0.2

[train]
out_dir = "out/phase1_430m"
seq_len = 2048
micro_batch_size = 2
grad_accum_steps = 16   # 2*16*2048*4 GPUs = 262k tokens/step
max_steps = 40000       # ~10B tokens
parallel = "ddp"
dtype = "bfloat16"
compile = true
eval_interval = 500
eval_steps = 50
log_interval = 20
# A preemptible host can vanish mid-run, and at 2000 steps a 2x3090 pair would
# lose ~8h of work. 200 steps costs ~50 min at worst and a 4.9GB write each time.
ckpt_interval = 200
keep_last_n_ckpts = 3
wandb_project = "gpt-sv"
wandb_run_name = "phase1-430m"
