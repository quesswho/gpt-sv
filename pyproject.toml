[project]
name = "gptsv"
version = "0.0.1"
description = "A family of Swedish-first language models: modern architecture, MTP, Muon."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "tokenizers>=0.20",
    "transformers>=4.51",
    "datasets>=3.0",
    "tqdm>=4.66",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
logging = ["wandb>=0.18"]

[project.scripts]
gptsv-train = "gptsv.train:main"
gptsv-generate = "gptsv.generate:main"
gptsv-data = "gptsv.data.prepare:main"
gptsv-tokenizer = "gptsv.tokenizer.train:main"
gptsv-tokenizer-reserve = "gptsv.tokenizer.reserve:main"
gptsv-export-hf = "gptsv.hf:main"
gptsv-fertility = "gptsv.tokenizer.fertility:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gptsv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# /tokenizers/ holds trained tokenizer artifacts; without this, ruff mistakes
# the `tokenizers` library for a first-party package.
known-third-party = ["tokenizers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
